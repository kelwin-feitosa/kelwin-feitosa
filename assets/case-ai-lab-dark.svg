<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
<title id="title">Development with AI as an experiment</title>
<desc id="desc">Decorative illustration of a conceptual iterative process: problem, specification, AI generation, review and learning.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0D1728"/><stop offset="1" stop-color="#172840"/></linearGradient></defs>
<rect width="1200" height="180" rx="16" fill="url(#bg)"/>
<path d="M0 153H1200" stroke="#496682" stroke-width="1" opacity=".6"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="40" y="44" font-size="13" letter-spacing="2.7" font-weight="700" fill="#82B5FF">03 / RESEARCH &amp; EXPERIMENTS</text>
<text x="40" y="98" font-size="33" letter-spacing="1.3" font-weight="700" fill="#F4F7FC">AI AS A WORKFLOW</text>
<text x="42" y="133" font-size="14" letter-spacing="1.6" fill="#A8BBD1">EVALUATE THE PROCESS, NOT THE HYPE</text>
<rect x="567" y="60" width="117" height="61" rx="11" fill="#1B2E48" stroke="#496682" stroke-width="1.4"/><text x="625.5" y="97" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.1" fill="#F4F7FC">PROBLEM</text><path d="M685 90H692" stroke="#82B5FF" stroke-width="2" stroke-linecap="round"/><rect x="693" y="60" width="117" height="61" rx="11" fill="#1B2E48" stroke="#496682" stroke-width="1.4"/><text x="751.5" y="97" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.1" fill="#F4F7FC">SPECIFY</text><path d="M811 90H818" stroke="#82B5FF" stroke-width="2" stroke-linecap="round"/><rect x="819" y="60" width="117" height="61" rx="11" fill="#1B2E48" stroke="#496682" stroke-width="1.4"/><text x="877.5" y="97" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.1" fill="#F4F7FC">GENERATE</text><path d="M937 90H944" stroke="#82B5FF" stroke-width="2" stroke-linecap="round"/><rect x="945" y="60" width="117" height="61" rx="11" fill="#1B2E48" stroke="#FFBF88" stroke-width="2"/><text x="1003.5" y="97" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.1" fill="#F4F7FC">REVIEW</text><path d="M1063 90H1070" stroke="#82B5FF" stroke-width="2" stroke-linecap="round"/><rect x="1071" y="60" width="117" height="61" rx="11" fill="#1B2E48" stroke="#496682" stroke-width="1.4"/><text x="1129.5" y="97" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.1" fill="#F4F7FC">LEARN</text>
<text x="572" y="143" font-size="12" letter-spacing="1.0" fill="#A8BBD1">A conceptual workflow, not a claim of complete human validation</text></g>
</svg>